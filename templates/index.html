{% extends "base.html" %}

{% block title %}GUDLFT Registration{% endblock %}

{% block content %}
<section class="panel">
    <p class="eyebrow">Club secretaries</p>
    <h1>Welcome to the GUDLFT Registration Portal!</h1>
    <p class="lead">Please enter your secretary email to continue:</p>
    <form action="{{ url_for('showSummary') }}" method="post" class="form-row">
        <div class="field">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required>
        </div>
        <button type="submit">Enter</button>
    </form>
</section>
<p class="aside">
    <a href="{{ url_for('pointsBoard') }}">See the clubs points board</a>
    &mdash; public page, no login needed.
</p>
{% endblock %}
