<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points Board | GUDLFT</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #888; padding: 4px 12px; text-align: left; }
        th { background-color: #ddd; }
    </style>
</head>
<body>
    <h2>Clubs Points Board</h2>
    <table>
        <thead>
            <tr><th>Club</th><th>Points available</th></tr>
        </thead>
        <tbody>
        {% for club in clubs %}
            <tr><td>{{club['name']}}</td><td>{{club['points']}}</td></tr>
        {% endfor %}
        </tbody>
    </table>
    <p><a href="{{url_for('index')}}">Back to login</a></p>
</body>
</html>
